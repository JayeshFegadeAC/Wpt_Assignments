<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechNova Solutions - HR Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h2>TechNova HR Portal</h2>
        <form action="directory.html" method="POST">
            <input type="text" class="custom-input" placeholder="Username" required>
            <input type="password" class="custom-input" placeholder="Password" required>
            <button type="submit" id="btn-login">Login</button>
        </form>
        <div class="signup-link">
            <a href="onboarding.html" class="no-underline">New Joiner? Onboarding Form</a>
        </div>
    </div>
</body>
</html>
