<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechNova - New Joiner Onboarding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="portal-nav">
        <div class="brand">TechNova Solutions</div>
        <nav>
            <a href="login.html">Login</a>
            <a href="directory.html">Directory</a>
            <a href="onboarding.html">Onboarding</a>
        </nav>
    </header>

    <main class="portal-content">
        <h1>Form of Onboarding</h1>
        
        <form action="http://localhost/onboard_submit" method="POST">
            <fieldset>
                <legend>Personal Information</legend>
                
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full_name" placeholder="e.g. Lalit Patil" required>

                <label for="official-email">Official email</label>
                <input type="email" id="official-email" name="official_email" placeholder="lalit.patil@technova.com" required>

                <label for="temp-pass">Temporary password</label>
                <input type="password" id="temp-pass" name="temp_password" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label>Gender</label>
                <input type="radio" id="g-male" name="gender" value="male">
                <label for="g-male" class="inline">Male</label>
                <input type="radio" id="g-female" name="gender" value="female">
                <label for="g-female" class="inline">Female</label>
            </fieldset>

            <fieldset>
                <legend>Job & Qualifications</legend>

                <label for="joining-date">Joining Date</label>
                <input type="date" id="joining-date" name="joining_date" required>

                <label for="orientation-slot">Orientation slot</label>
                <input type="datetime-local" id="orientation-slot" name="orientation_slot">

                <label for="reporting-time">Reporting time on day one</label>
                <input type="time" id="reporting-time" name="reporting_time">

                <label for="qualification">Highest qualification</label>
                <select id="qualification" name="qualification">
                    <option value="ssc">SSC</option>
                    <option value="diploma">Diploma</option>
                    <option value="btech">B.Tech / B.E.</option>
                    <option value="mtech">M.Tech</option>
                </select>

                <label for="department">Department</label>
                <select id="department" name="department">
                    <option value="it">IT</option>
                    <option value="hr">Human Resources</option>
                    <option value="data">Data Science</option>
                    <option value="ops">Operations</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Address & Attachments</legend>

                <label for="address">Current address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter address"></textarea>

                <label for="resume-upload">Passport photo or resume</label>
                <input type="file" id="resume-upload" name="resume_upload">

                <div style="margin-top: 10px;">
                    <input type="checkbox" id="declaration" name="declaration" required>
                    <label for="declaration" class="inline">I declare that all details are true.</label>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn-portal">Submit</button>
                <button type="reset" class="btn-portal btn-reset">Reset</button>
            </div>
        </form>
    </main>
</body>
</html>
